name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The frontend image runs `npm run build`; GitHub Actions sets CI=true,
      # so any lint warning fails the build.
      - name: Build frontend image
        run: docker build -f frontend.Dockerfile -t trainer-frontend:ci .

      - name: Build backend image
        run: docker build -f backend.Dockerfile -t trainer-backend:ci .

      - name: Validate docker-compose
        run: docker compose config -q
