name: DB Backup

# Tägliches pg_dump der Railway-Produktions-DB. Die Dumps landen (gzip)
# auf dem Branch `db-backups`, die letzten 30 werden behalten.
#
# Voraussetzung: Repo-Secret RAILWAY_DATABASE_URL = öffentliche
# Postgres-Verbindung über den Railway-TCP-Proxy. Siehe BACKUPS.md.

on:
  schedule:
    - cron: '0 3 * * *'      # täglich 03:00 UTC
  workflow_dispatch: {}       # manuell auslösbar (Actions-Tab)

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pg_dump
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret RAILWAY_DATABASE_URL fehlt – siehe BACKUPS.md"
            exit 1
          fi
          mkdir -p out
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:16-alpine \
            sh -c 'pg_dump --no-owner --no-privileges --clean --if-exists "$DATABASE_URL"' \
            | gzip -9 > "out/hpv_${TS}.sql.gz"
          SIZE=$(stat -c%s "out/hpv_${TS}.sql.gz")
          echo "Dump: out/hpv_${TS}.sql.gz (${SIZE} bytes)"
          # Ein gültiger gzip-Dump ist immer > 300 Bytes; leerer/abgebrochener Dump -> Fehler
          if [ "$SIZE" -lt 300 ]; then
            echo "::error::Dump verdächtig klein – Abbruch, nichts committen"
            exit 1
          fi
          echo "TS=$TS" >> "$GITHUB_ENV"

      - name: Commit auf db-backups
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin db-backups || true
          if git show-ref --verify --quiet refs/remotes/origin/db-backups; then
            git checkout -B db-backups origin/db-backups
          else
            git checkout --orphan db-backups
            git rm -rf --quiet . || true
            printf '# HPV-Trainer – DB-Backups\n\nAutomatische tägliche pg_dumps (`dumps/`, gzip). Restore: siehe `BACKUPS.md` im `main`-Branch.\n' > README.md
            git add README.md
          fi
          mkdir -p dumps
          cp out/hpv_*.sql.gz dumps/
          # nur die 30 neuesten behalten
          ls -1t dumps/hpv_*.sql.gz | tail -n +31 | xargs -r rm -f
          git add dumps
          git commit -m "DB backup ${TS}" || { echo "nichts zu committen"; exit 0; }
          git push origin db-backups
