services:
  db:
    image: postgres:15-alpine
    container_name: trainer_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: trainer_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: trainer_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/trainer_portal
      JWT_SECRET: supersecret_trainer_token_key
      PORT: 5000
    volumes:
      # Hochgeladene Dateien liegen im Named Volume "uploads". Bei einer
      # bestehenden Installation, die VORHER ohne dieses Volume lief, müssen
      # die alten Dateien einmalig migriert werden – siehe BACKUPS.md
      # ("Uploads-Verzeichnis auf Named Volume migrieren"), sonst gehen sie
      # beim ersten `docker-compose up` verloren.
      - uploads:/app/uploads
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: trainer_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  uploads:
