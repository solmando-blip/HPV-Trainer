server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # API-Aufrufe an das Backend (eigener Railway-Service) weiterreichen.
    # Der Frontend-Code ruft alles relativ unter /api/... auf.
    location /api/ {
        proxy_pass https://hpv-trainer-backend-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host hpv-trainer-backend-production.up.railway.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
